<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eb3ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52d18b"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93a1b3"/></marker>
  </defs>

  <rect width="900" height="470" rx="14" fill="#0e1116"/>

  <!-- browser -->
  <rect x="24" y="168" width="118" height="92" rx="12" fill="#161b23" stroke="#2a323f"/>
  <text x="40" y="192" fill="#e6edf3" font-size="12.5" font-weight="650">a browser</text>
  <text x="40" y="212" fill="#93a1b3" font-size="10">the whole team —</text>
  <text x="40" y="226" fill="#93a1b3" font-size="10">devs, analysts,</text>
  <text x="40" y="240" fill="#93a1b3" font-size="10">support</text>
  <text x="40" y="256" fill="#5b6878" font-size="9.5">no DB client, no</text>

  <!-- app -->
  <rect x="176" y="36" width="426" height="352" rx="14" fill="#12171f" stroke="#2a323f"/>
  <text x="192" y="58" fill="#93a1b3" font-size="11.5" font-weight="600" letter-spacing=".07em">DbExplorer · .NET 10 BLAZOR SERVER · SELF-HOSTED</text>

  <rect x="192" y="72" width="394" height="86" rx="10" fill="#161b23" stroke="#2a323f"/>
  <text x="206" y="93" fill="#e6edf3" font-size="12" font-weight="650">sign-in — three providers, feature-flagged</text>
  <text x="206" y="111" fill="#93a1b3" font-size="10">local: username + PBKDF2 (350k iterations)</text>
  <text x="206" y="125" fill="#93a1b3" font-size="10">Windows Negotiate (Kerberos / NTLM) · Google OAuth (+ allow-list)</text>
  <text x="206" y="143" fill="#52d18b" font-size="10">all issue the same session cookie — one scheme protects everything</text>

  <rect x="192" y="170" width="394" height="104" rx="10" fill="#161b23" stroke="#2a323f"/>
  <text x="206" y="191" fill="#e6edf3" font-size="12" font-weight="650">services</text>
  <text x="206" y="209" fill="#93a1b3" font-size="10">Metadata · DataBrowsing · Query Builder · Profiler · AdHocQuery</text>
  <text x="206" y="227" fill="#93a1b3" font-size="10">schema/object names: static format check + live catalog check</text>
  <text x="206" y="241" fill="#93a1b3" font-size="10">page, size, filter, column: Dapper parameters — never interpolated</text>
  <text x="206" y="259" fill="#5b6878" font-size="9.5">API rate-limited 120 req/min per IP</text>

  <rect x="192" y="286" width="394" height="88" rx="10" fill="#161b23" stroke="#5eb3ff" stroke-opacity=".35"/>
  <text x="206" y="307" fill="#e6edf3" font-size="12" font-weight="650">/mcp — optional, off by default</text>
  <text x="206" y="325" fill="#93a1b3" font-size="10">7 read-only tools for an AI assistant, behind a Bearer token</text>
  <text x="206" y="339" fill="#93a1b3" font-size="10">same read-only guard as the Profiler editor</text>
  <text x="206" y="357" fill="#5b6878" font-size="9.5">returns 503 until Mcp:ApiKey is set — no unauthenticated mode</text>

  <!-- connection factory + dbs -->
  <rect x="636" y="120" width="240" height="72" rx="10" fill="#161b23" stroke="#2a323f"/>
  <text x="652" y="141" fill="#e6edf3" font-size="12" font-weight="650">SqlConnectionFactory</text>
  <text x="652" y="159" fill="#93a1b3" font-size="10">one connection per request,</text>
  <text x="652" y="173" fill="#93a1b3" font-size="10">no pooling singleton</text>

  <rect x="636" y="208" width="240" height="128" rx="10" fill="#161b23" stroke="#52d18b" stroke-opacity=".4"/>
  <text x="652" y="229" fill="#e6edf3" font-size="12" font-weight="650">your databases</text>
  <text x="652" y="248" fill="#93a1b3" font-size="10.5">SQL Server · MySQL · PostgreSQL</text>
  <text x="652" y="264" fill="#93a1b3" font-size="10.5">multiple instances, side by side</text>
  <text x="652" y="286" fill="#52d18b" font-size="10">connect with a read-only account</text>
  <text x="652" y="300" fill="#5b6878" font-size="9.5">db_datareader / GRANT SELECT — the</text>
  <text x="652" y="313" fill="#5b6878" font-size="9.5">last line of defence, not the only one</text>

  <!-- audit -->
  <rect x="176" y="402" width="426" height="52" rx="10" fill="#161b23" stroke="#2a323f"/>
  <text x="192" y="423" fill="#e6edf3" font-size="11.5" font-weight="650">AuditLogger — optional</text>
  <text x="192" y="440" fill="#93a1b3" font-size="10">who · what · when · row count — no row data — to any Serilog sink (GDPR)</text>

  <!-- arrows -->
  <path d="M142 214 L172 214" stroke="#5eb3ff" stroke-width="2" marker-end="url(#b)"/>
  <path d="M586 200 L632 175" stroke="#93a1b3" stroke-width="2" marker-end="url(#m)"/>
  <path d="M756 192 L756 204" stroke="#52d18b" stroke-width="2" marker-end="url(#g)"/>

  <!-- banner -->
  <text x="24" y="462" fill="#93a1b3" font-size="10.5">read-only at every layer — only SELECT and catalog queries are ever issued; DDL and DML are blocked server-side before they reach a connection.</text>
</svg>
